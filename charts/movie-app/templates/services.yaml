{{- range $name, $svc := .Values.services }}
{{- $db := index $.Values.databases $svc.database }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "movie-app.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "movie-app.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "movie-app.image" (list $ $name) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: {{ $db.secretName }}, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $db.secretName }}, key: password }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: {{ $db.secretName }}, key: database }
            # Kubernetes substitue les variables $(…) déclarées au-dessus
            - name: DATABASE_URI
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@{{ $svc.database }}:5432/$(DB_NAME)"
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          # Liveness sur le port uniquement : une panne de la base ne doit pas
          # provoquer de redémarrages en cascade de l'application.
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            {{- include "movie-app.containerSecurityContext" $ | nindent 12 }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "movie-app.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
