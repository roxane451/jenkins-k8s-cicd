# Passerelle HTTP devant les deux services.
# Les noms d'upstream sont les noms de service Docker Compose / Kubernetes.
upstream movie_service {
    server movie-service:8000;
}

upstream cast_service {
    server cast-service:8000;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;

    location /api/v1/movies {
        proxy_pass http://movie_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/casts {
        proxy_pass http://cast_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 404;
    }
}
