# Environnement local : docker compose up --build
# puis http://localhost:8080/api/v1/movies/docs et /api/v1/casts/docs
# Les identifiants par défaut ne servent qu'en local ; surcharger via un fichier .env.

services:
  movie-service:
    build: ./movie-service
    environment:
      DATABASE_URI: postgresql://${MOVIE_DB_USER:-movie}:${MOVIE_DB_PASSWORD:-movie}@movie-db:5432/${MOVIE_DB_NAME:-movie_db}
      CAST_SERVICE_HOST_URL: http://cast-service:8000/api/v1/casts/
    depends_on:
      movie-db:
        condition: service_healthy

  movie-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${MOVIE_DB_USER:-movie}
      POSTGRES_PASSWORD: ${MOVIE_DB_PASSWORD:-movie}
      POSTGRES_DB: ${MOVIE_DB_NAME:-movie_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    volumes:
      - movie-db-data:/var/lib/postgresql/data

  cast-service:
    build: ./cast-service
    environment:
      DATABASE_URI: postgresql://${CAST_DB_USER:-cast}:${CAST_DB_PASSWORD:-cast}@cast-db:5432/${CAST_DB_NAME:-cast_db}
    depends_on:
      cast-db:
        condition: service_healthy

  cast-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CAST_DB_USER:-cast}
      POSTGRES_PASSWORD: ${CAST_DB_PASSWORD:-cast}
      POSTGRES_DB: ${CAST_DB_NAME:-cast_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    volumes:
      - cast-db-data:/var/lib/postgresql/data

  gateway:
    build: ./nginx
    ports:
      - "8080:8080"
    depends_on:
      - movie-service
      - cast-service

volumes:
  movie-db-data:
  cast-db-data:
